<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 能力等级测评</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bg::before{content:'';position:absolute;top:20%;left:50%;width:600px;height:600px;background:radial-gradient(circle,rgba(102,126,234,0.15),transparent 70%);transform:translate(-50%,-50%);border-radius:50%}
.bg::after{content:'';position:absolute;bottom:10%;right:20%;width:400px;height:400px;background:radial-gradient(circle,rgba(118,75,162,0.12),transparent 70%);border-radius:50%}
.container{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:24px 16px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.page{display:none;animation:fadeIn .4s ease}
.page.active{display:flex;flex-direction:column;align-items:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.welcome-title{font-size:2.4rem;font-weight:700;text-align:center;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.welcome-sub{text-align:center;color:#aaa;font-size:1rem;margin-bottom:40px}
.stats{display:flex;justify-content:center;gap:32px;margin-bottom:48px;flex-wrap:wrap}
.stat{text-align:center}
.stat-num{font-size:2rem;font-weight:700;color:#667eea}
.stat-label{font-size:.85rem;color:#888;margin-top:4px}
.btn{display:inline-block;padding:14px 48px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:50px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(102,126,234,0.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(102,126,234,0.5)}
.btn:active{transform:translateY(0)}
/* Quiz */
.progress-wrap{width:100%;margin-bottom:32px}
.progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);transition:width .4s ease;border-radius:3px}
.progress-text{text-align:center;margin-top:8px;font-size:.85rem;color:#888}
.question-text{font-size:1.2rem;font-weight:500;line-height:1.7;margin-bottom:28px;text-align:center;width:100%}
.options{width:100%;display:flex;flex-direction:column;gap:12px}
.option{padding:16px 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;cursor:pointer;transition:all .3s;display:flex;align-items:flex-start;gap:12px}
.option:hover{background:rgba(102,126,234,0.1);border-color:rgba(102,126,234,0.3)}
.option.selected{background:rgba(102,126,234,0.15);border-color:#667eea;box-shadow:0 0 20px rgba(102,126,234,0.2)}
.option-letter{min-width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;color:#888;transition:all .3s}
.option.selected .option-letter{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.option-text{flex:1;line-height:1.6;padding-top:2px}
.nav-row{margin-top:24px;display:flex;gap:12px}
.btn-sm{padding:10px 24px;font-size:.9rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#ccc;border-radius:8px;cursor:pointer;transition:all .3s}
.btn-sm:hover{background:rgba(255,255,255,0.12)}
/* Result */
.result-level{font-size:4rem;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.result-name{font-size:1.6rem;font-weight:600;margin-bottom:8px;color:#fff}
.result-keyword{display:inline-block;padding:4px 16px;background:rgba(102,126,234,0.15);border:1px solid rgba(102,126,234,0.3);border-radius:20px;font-size:.85rem;color:#667eea;margin-bottom:24px}
.result-desc{text-align:center;color:#bbb;line-height:1.7;margin-bottom:36px;max-width:560px}
.dims{width:100%;max-width:480px;margin-bottom:36px}
.dim-row{margin-bottom:16px}
.dim-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.9rem}
.dim-name{color:#ccc}
.dim-val{font-weight:600}
.dim-bar{height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden}
.dim-fill{height:100%;border-radius:5px;transition:width 1s ease}
.advice-box{width:100%;max-width:520px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;margin-bottom:32px}
.advice-title{font-size:1rem;font-weight:600;margin-bottom:12px;color:#667eea}
.advice-list{list-style:none;padding:0}
.advice-list li{padding:8px 0;padding-left:20px;position:relative;color:#bbb;line-height:1.6;font-size:.9rem}
.advice-list li::before{content:'→';position:absolute;left:0;color:#667eea}
.btn-group{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn-outline{padding:12px 32px;background:transparent;border:1px solid rgba(102,126,234,0.5);color:#667eea;border-radius:50px;font-size:.95rem;cursor:pointer;transition:all .3s}
.btn-outline:hover{background:rgba(102,126,234,0.1)}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
@media(max-width:600px){.welcome-title{font-size:1.8rem}.stats{gap:20px}.stat-num{font-size:1.5rem}.question-text{font-size:1.05rem}.result-level{font-size:3rem}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const questions=[
{q:"你需要在 2 小时内完成一份陌生行业的初步分析报告，你通常会怎么做？",options:["先搜索几篇资料，自己整理重点，AI 只用来润色文字。","直接让 AI 写一份完整报告，再根据感觉删改。","让 AI 先搭行业框架、列关键问题、标注不确定部分，再分批补资料。","建立一个临时研究流程：资料收集、观点提炼、交叉验证、结论生成、风险检查分别交给不同步骤处理。"],dim:"breadth"},
{q:"AI 给了你一个看起来很专业、但你不确定真假的答案，你的第一反应是？",options:["看起来合理就先用，反正只是参考。","换另一个 AI 再问一遍，看两个答案是否一致。","要求 AI 标注依据、区分事实与推测，并指出最可能出错的部分。","把答案放进一个验证流程：查来源、比对原始材料、让另一个模型反驳，再决定是否采用。"],dim:"control"},
{q:"你经常遇到一类重复任务，比如周报、客户回复、内容改写、数据整理。你会怎么处理？",options:["每次需要时再问 AI，一次解决一次。","保存几个常用提示词，下次复制修改。","沉淀成固定模板，包括输入格式、输出格式、判断标准和禁用规则。","封装成自动化流程或专用助手，让它按固定步骤处理并自检。"],dim:"form"},
{q:"当你第一次使用一个新的 AI 工具时，你最关注什么？",options:["它是不是免费、界面顺不顺手。","它能不能直接帮我完成眼前任务。","它适合处理哪类任务，和我现有工具相比强弱在哪里。","它能否接入我的知识库、工作流、文件系统或长期项目体系。"],dim:"form"},
{q:"你让 AI 写了一篇文章，内容基本对，但不像你的风格。你会怎么做？",options:["自己手动改，AI 写出来本来就只能当草稿。","告诉 AI"再自然一点""更像人写的"。","给 AI 几篇自己的历史作品，让它提炼风格后重写。","建立个人写作风格文档，持续更新禁用词、表达偏好、结构范式和优秀样例。"],dim:"control"},
{q:"如果你要做一个自己不熟悉的小工具，比如网页计算器、自动表格清洗脚本或简单插件，你会怎么推进？",options:["我不会做，最多让 AI 给我解释原理。","让 AI 直接生成代码，能跑就行。","让 AI 先拆任务、说明文件结构，再一步步生成、运行、报错修复。","让 Agent 读取项目、实现功能、运行测试、检查界面，再输出变更说明和风险点。"],dim:"breadth"},
{q:"你所在团队准备引入 AI，你会优先建议大家做什么？",options:["先统一使用一个热门 AI 工具。","先收集大家常见需求，整理一批通用提示词。","先识别高频、低风险、标准明确的任务，做场景化试点。","先设计团队级 AI 工作流、权限边界、知识库、质检机制和复盘标准。"],dim:"role"},
{q:"当 AI 的回答与你原本判断冲突时，你通常会？",options:["以自己的判断为准，AI 只是辅助。","如果 AI 说得有道理，就改用 AI 的答案。","让 AI 解释推理链路，并要求它同时为双方观点找证据。","把冲突变成决策实验：列假设、找证据、做反方推演，再形成判断。"],dim:"control"},
{q:"你如何理解"会用 AI"？",options:["能让 AI 帮自己写东西、查资料、做总结。","能写出比较好的提示词，让 AI 输出更符合要求。","能把 AI 放进自己的工作流程，让它稳定参与多个环节。","能构建一套人机协作系统，把自己的判断力、知识和流程复制到多个任务中。"],dim:"role"},
{q:"你收到一个复杂任务：做选题、调研、写稿、配图、发布、复盘。你会如何分配给 AI？",options:["让 AI 先写一版完整内容，我再看能不能用。","每个环节单独问 AI，需要什么问什么。","把任务拆成几个阶段，每个阶段给不同要求和验收标准。","设计一条完整生产流水线，让 AI 负责调研、草稿、检查、改写、复盘，人负责方向和最终判断。"],dim:"form"},
{q:"你平时保存 AI 对话或产出吗？",options:["基本不保存，用完就关。","偶尔保存好用的回答。","会按场景整理常用 Prompt、案例和资料。","会把优秀输出、失败案例、风格标准、流程规则沉淀成长期知识资产。"],dim:"role"},
{q:"你发现一个 AI 工具最近很火，很多人推荐。你会？",options:["跟风试一下，看看好不好玩。","找几个任务测试一下，哪个结果好用哪个。","用同一组任务对比它和现有工具的表现。","判断它能否成为现有系统的一部分：是否可调用、可复用、可接入流程、可稳定产出。"],dim:"breadth"},
{q:"当你让 AI 做一项任务时，最常给出的信息是什么？",options:["只说我要什么结果。","会补充背景、对象、字数和风格。","会给目标、上下文、示例、格式、边界和判断标准。","会给完整任务说明，包括输入、输出、流程、质量标准、风险处理和复盘要求。"],dim:"control"},
{q:"如果 AI 连续三次都没答到点上，你会怎么处理？",options:["放弃，说明它不适合这个任务。","换一个 AI 工具试试。","重新定义任务，补充背景和反例，让它先复述需求。","分析失败原因：是上下文不足、目标不清、工具不适配，还是任务本身需要拆解，然后重构流程。"],dim:"control"},
{q:"你怎么看 AI 在陌生领域给你的建议？",options:["不太敢用，毕竟我不懂。","可以用来快速入门，但最终还是看感觉。","可以用来建立框架，但关键事实和专业判断必须验证。","可以作为跨界执行入口，但要配套专家标准、反向检查和风险边界。"],dim:"breadth"},
{q:"你是否会让 AI 参与你的早期思考？",options:["通常不会，我想清楚后再让 AI 执行。","有时会让 AI 帮我发散想法。","会在构思阶段让 AI 提供框架、反例、路径和盲点。","几乎所有复杂任务一开始就有人机共同建模，AI 参与定义问题本身。"],dim:"form"},
{q:"你最常见的 AI 使用成果是什么？",options:["一段文字、一个总结、一个答案。","一个可用版本，比如邮件、方案、脚本或图片。","一个经过多轮校准、能进入真实工作的成果。","一个可复用的流程、工具、模板、系统或作品。"],dim:"breadth"},
{q:"如果你要把自己的 AI 使用经验教给别人，你会怎么教？",options:["推荐几个好用工具。","教几个常用提示词模板。","教他们如何描述任务、补充上下文、约束输出和检查结果。","教他们如何识别任务类型、设计流程、沉淀资产，并逐步构建自己的 AI 工作系统。"],dim:"role"},
{q:"对你来说，AI 最像什么？",options:["更聪明的搜索引擎。","一个随叫随到的助手。","一个需要管理、训练和校准的协作者。","一个可以被组织成生产系统的执行网络。"],dim:"role"},
{q:"当一个新任务进入你的工作流时，你通常会？",options:["先自己做，遇到卡点再问 AI。","先问 AI 能不能帮我做。","先判断任务中哪些部分适合 AI，哪些必须由自己判断。","直接把任务接入自己的 AI 系统，调用资料、流程、工具和检查机制。"],dim:"form"}
];
const levels=[
{lv:0,name:"旁观者",keyword:"听说",desc:"你尚未真正开始使用 AI，对 AI 的认知停留在新闻和他人转述层面。",advice:["下载一款 AI App 并完成第一次对话","每天至少问 AI 一个问题","不要追求完美提问，先建立使用习惯"]},
{lv:1,name:"尝鲜者",keyword:"搜索",desc:"你已经开始使用 AI，但方式比较随机，对结果好坏缺乏掌控力。",advice:["学会在提问时补充背景信息","拿到不满意的回答时追问而不是放弃","记录好/坏回答并分析原因"]},
{lv:2,name:"对话者",keyword:"Prompt",desc:"你开始意识到"怎么问"比"问什么"更重要，会主动调整提问方式来提升输出质量。",advice:["学习结构化 Prompt（角色+背景+任务+格式+约束）","给 AI 提供参考资料而非让它凭空生成","在 2-3 个固定场景中建立使用习惯"]},
{lv:3,name:"驯化师",keyword:"约束",desc:"你掌握了约束型 Prompt，能让 AI 稳定产出符合预期的结果，并开始区分不同模型的能力。",advice:["尝试用 AI 做一件你专业以外的事","建立自己的工具选择规则","开始在 AI 产出基础上多轮迭代"]},
{lv:4,name:"跨界者",keyword:"跨界",desc:"你开始用 AI 突破专业边界，能力版图大幅扩张，工具栈开始丰富。",advice:["为高频任务建立 Prompt 模板库","为不同工作领域建立独立 AI 项目专区","有意识地收集数据构建个人知识库"]},
{lv:5,name:"织网者",keyword:"上下文",desc:"AI 已嵌入你的日常工作流，你有模板库、项目分区和知识库，开始系统性设计人机协作方式。",advice:["尝试使用 Agent 工具（如 Claude Code）","让 AI 直接操作文件而非只给建议","学习 MCP 和工具调用的基本概念"]},
{lv:6,name:"召唤师",keyword:"Agent",desc:"你跨越了 ChatBot 到 Agent 的门槛，AI 能直接与你的设备交互、执行多步骤任务。",advice:["把常用流程封装成第一个 Skill","设计 AI 反馈循环（产出→评估→反馈→迭代）","为你的 Agent 写一份系统提示/工作手册"]},
{lv:7,name:"铸造师",keyword:"Skill",desc:"你开始创造自己的 AI 工具——Skill、工作流、Agent 配置，愿意为未来效率投资当下时间。",advice:["用 AI 创造一个完整的小产品或作品","设计多 Agent 协作流程","让你的 AI 系统开始为他人/团队创造价值"]},
{lv:8,name:"造物主",keyword:"结果",desc:"你用 AI 持续创造真实产品和作品，四个维度全部拉满，人与 AI 的协作已经无感融合。",advice:["让 AI-First 成为思维本能而非刻意练习","开始系统化输出你的方法论","把你的工作范式传播给更多人"]},
{lv:9,name:"觉醒者",keyword:"AI-First",desc:"AI-First 已成为你的思维方式，你创造方法论和工作范式，影响他人使用 AI 的方式。",advice:["构建完整的 AI Native 个人系统","在多个领域同时产出准专业水准的结果","持续培养判断力和审美——这是 AI 给不了的"]},
{lv:10,name:"一人军团",keyword:"AI Native",desc:"你的产出能力已无法用"个人"衡量，一人对标传统几十人团队，这是一种全新的组织形态。",advice:["持续投资判断力、审美和价值体系","把 AI 能力的进化视为自身能力的进化","记住：工具平权的终局是人的不平权"]}
];
const dimMap={control:[1,4,7,12,13],breadth:[0,5,11,14,16],form:[2,3,9,15,19],role:[6,8,10,17,18]};
const dimColors={control:'#60a5fa',breadth:'#34d399',form:'#fbbf24',role:'#f472b6'};
const dimNames={control:'可控',breadth:'广度',form:'形态',role:'角色'};
const scoreMap=[1,3,6,9];
let answers=new Array(20).fill(-1);
let currentQ=0;
const app=document.getElementById('app');
function render(page){
  if(page==='welcome') renderWelcome();
  else if(page==='quiz') renderQuiz();
  else if(page==='result') renderResult();
}
function renderWelcome(){
  app.innerHTML=`<div class="page active">
    <h1 class="welcome-title">AI 能力等级测评</h1>
    <p class="welcome-sub">20 道情境题，测出你的 AI 使用等级</p>
    <div class="stats">
      <div class="stat"><div class="stat-num">20</div><div class="stat-label">道题</div></div>
      <div class="stat"><div class="stat-num">4</div><div class="stat-label">个维度</div></div>
      <div class="stat"><div class="stat-num">11</div><div class="stat-label">个等级</div></div>
    </div>
    <button class="btn" onclick="startQuiz()">开始测评</button>
  </div>`;
}
function startQuiz(){currentQ=0;answers=new Array(20).fill(-1);render('quiz');}
function renderQuiz(){
  const q=questions[currentQ];
  const pct=((currentQ)/20*100).toFixed(0);
  const letters=['A','B','C','D'];
  let optHtml=q.options.map((o,i)=>`<div class="option${answers[currentQ]===i?' selected':''}" onclick="selectOption(${i})"><span class="option-letter">${letters[i]}</span><span class="option-text">${o}</span></div>`).join('');
  app.innerHTML=`<div class="page active">
    <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-text">第 ${currentQ+1} / 20 题</div></div>
    <div class="question-text">${q.q}</div>
    <div class="options">${optHtml}</div>
    <div class="nav-row">${currentQ>0?'<button class="btn-sm" onclick="prevQ()">上一题</button>':''}</div>
  </div>`;
}
function selectOption(i){
  answers[currentQ]=i;
  const opts=document.querySelectorAll('.option');
  opts.forEach((el,idx)=>{el.classList.toggle('selected',idx===i);});
  setTimeout(()=>{if(currentQ<19){currentQ++;renderQuiz();}else{render('result');}},600);
}
function prevQ(){if(currentQ>0){currentQ--;renderQuiz();}}
function renderResult(){
  const total=answers.reduce((s,a)=>s+scoreMap[a],0);
  const avg=total/20;
  let lvIdx=0;
  if(avg>=9.6)lvIdx=10;else if(avg>=9)lvIdx=9;else if(avg>=8)lvIdx=8;else if(avg>=7)lvIdx=7;else if(avg>=6)lvIdx=6;else if(avg>=5)lvIdx=5;else if(avg>=4)lvIdx=4;else if(avg>=3)lvIdx=3;else if(avg>=2)lvIdx=2;else if(avg>=1)lvIdx=1;else lvIdx=0;
  const lv=levels[lvIdx];
  const dims={};
  for(const[k,indices]of Object.entries(dimMap)){
    const sum=indices.reduce((s,i)=>s+scoreMap[answers[i]],0);
    dims[k]=Math.round(sum/5/9*100);
  }
  let dimHtml='';
  for(const[k,v]of Object.entries(dims)){
    dimHtml+=`<div class="dim-row"><div class="dim-label"><span class="dim-name">${dimNames[k]}</span><span class="dim-val" style="color:${dimColors[k]}">${v}%</span></div><div class="dim-bar"><div class="dim-fill" style="width:${v}%;background:${dimColors[k]}"></div></div></div>`;
  }
  let advHtml=lv.advice.map(a=>`<li>${a}</li>`).join('');
  app.innerHTML=`<div class="page active">
    <div class="result-level">Lv.${lv.lv}</div>
    <div class="result-name">${lv.name}</div>
    <div class="result-keyword">${lv.keyword}</div>
    <p class="result-desc">${lv.desc}</p>
    <div class="dims">${dimHtml}</div>
    <div class="advice-box"><div class="advice-title">晋升建议</div><ul class="advice-list">${advHtml}</ul></div>
    <div class="btn-group">
      <button class="btn" onclick="render('welcome')">重新测评</button>
      <button class="btn-outline" onclick="copyResult(${lv.lv},'${lv.name}',${dims.control},${dims.breadth},${dims.form},${dims.role})">复制结果</button>
    </div>
  </div>`;
  setTimeout(()=>{document.querySelectorAll('.dim-fill').forEach(el=>{el.style.width=el.style.width;});},50);
}
function copyResult(lv,name,c,b,f,r){
  const text=`我的 AI 能力等级：Lv.${lv} ${name} | 可控 ${c}% | 广度 ${b}% | 形态 ${f}% | 角色 ${r}%`;
  navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板')).catch(()=>showToast('复制失败，请手动复制'));
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
render('welcome');
</script>
</body>
</html>
